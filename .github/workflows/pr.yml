name: PR

# bench/netdiag (ARK-25): not a bench. One job on outrun-linux-arm64 measuring DNS and TCP/TLS
# connects to cache.outrun.sh and turbo-cache.arkadia.so, with curl and Bun's fetch (the action's
# Bun 1.4.4 and setup-bun's), and the kernel's retransmit counters (.github/netdiag/netdiag.sh).
# Named pr.yml so it can be dispatched on this branch (the fork's main has pr.yml).
on:
  workflow_dispatch:

permissions: {}

env:
  OUTRUN_CACHE_URL: https://cache.outrun.sh
  OUTRUN_CACHE_TEAM: netdiag

jobs:
  netdiag:
    name: netdiag
    runs-on: outrun-linux-arm64
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: outrun
        uses: arkadia-so/outrun@v1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: netdiag
        run: |
          BUN_ACTION=$(sed -n 's/^exec "\([^"]*\)".*/\1/p' "$(command -v outrun)")
          BUN_SETUP=$(command -v bun)
          OIDC=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://cache.outrun.sh" | jq -r .value)
          echo "::add-mask::$OIDC"
          export BUN_ACTION BUN_SETUP OIDC
          echo "action bun: $BUN_ACTION, setup-bun: $BUN_SETUP"
          .github/netdiag/netdiag.sh
