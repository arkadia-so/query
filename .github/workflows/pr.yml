name: PR

# ARK-81 bench: upstream's `test` job, runs-on swapped to outrun-linux-arm64 (ARM64).
# Changes vs upstream (written in the ARK-81 comment):
# - trigger: workflow_dispatch only (bench);
# - Nx Cloud agents steps dropped (need NX_CLOUD_ACCESS_TOKEN and their paid agents), NX_NO_CLOUD=true;
# - `pnpm run test:ci` (all projects) instead of `test:pr` (nx affected), so every run does the same work;
# - jobs `preview` (publishes pkg.pr.new previews) and `version-preview` (PR comment) dropped.
on:
  workflow_dispatch:

permissions: {}

env:
  NX_NO_CLOUD: "true"

jobs:
  test:
    name: Test
    runs-on: outrun-linux-arm64
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@e4b48f16568324f76f467aa4c2aac2f05db632c3
      - name: Run Checks
        run: pnpm run test:ci
