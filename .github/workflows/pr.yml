name: PR

# ARK-81 bench, engine variant: the "outrun as is" job (bench/outrun) with outrun's cache behind
# Nx. Nx stays the task runner; `outrun nx-cache` serves Nx's self-hosted remote cache API from
# outrun's cache (its namespace per bench round: input `cache`). ARM64 (outrun-linux-arm64).
# Same changes vs upstream as bench/outrun: workflow_dispatch, no Nx Cloud agents, test:ci.
on:
  workflow_dispatch:
    inputs:
      cache:
        description: outrun cache namespace
        required: false
        default: outrun

permissions: {}

env:
  NX_NO_CLOUD: "true"
  OUTRUN_CACHE_URL: https://turbo-cache.arkadia.so
  OUTRUN_CACHE_TEAM: ${{ inputs.cache || 'outrun' }}
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:7070
  # A replay is a download, not CPU: more at once than nx.json's 5 (also applies to cold runs).
  NX_PARALLEL: "10"

jobs:
  test:
    name: Test
    runs-on: outrun-linux-arm64
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Start outrun nx-cache
        run: |
          gunzip -c .github/outrun/outrun.js.gz > "$RUNNER_TEMP/outrun.js"
          nohup bun "$RUNNER_TEMP/outrun.js" nx-cache --port 7070 > "$RUNNER_TEMP/nx-cache.log" 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:7070/v1/cache/0 && break; sleep 0.2; done
          cat "$RUNNER_TEMP/nx-cache.log"
      - name: Setup Tools
        uses: TanStack/config/.github/setup@e4b48f16568324f76f467aa4c2aac2f05db632c3
      - name: Run Checks
        run: pnpm run test:ci
      - name: nx-cache log
        if: always()
        run: |
          grep -c . "$RUNNER_TEMP/nx-cache.log" || true
          tail -20 "$RUNNER_TEMP/nx-cache.log"
